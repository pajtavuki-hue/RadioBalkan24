name: Build RadioBalkan24 APK

on: [push, workflow_dispatch]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Find Android ZIP
    shell: bash
    run: |
      ZIP_FILE=$(find . -maxdepth 3 -type f -name 'RadioBalkan24*.zip' -not -path './.git/*' | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "ERROR: Android ZIP nije pronaden!"
        find . -maxdepth 3 -type f
        exit 1
      fi

      echo "Pronaden ZIP: $ZIP_FILE"
      mkdir -p project
      unzip -o "$ZIP_FILE" -d project

  - name: Locate Android project
    shell: bash
    run: |
      SETTINGS=$(find project -maxdepth 6 -type f -name settings.gradle -o -name settings.gradle.kts | head -n 1)

      if [ -z "$SETTINGS" ]; then
        echo "ERROR: Gradle projekt nije pronaden!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS")

      if [ ! -d "$PROJECT_DIR/app" ]; then
        echo "ERROR: Android app modul nije pronaden!"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Android projekt: $PROJECT_DIR"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Build APK
    shell: bash
    run: |
      cd "$PROJECT_DIR"

      if [ ! -f gradlew ]; then
        echo "ERROR: Gradle wrapper nije pronaden!"
        exit 1
      fi

      chmod +x gradlew
      ./gradlew --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RadioBalkan24-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
