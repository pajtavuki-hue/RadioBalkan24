name: Build RadioBalkan24 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "RadioBalkan24_ANDROID_ISPRAVLJEN.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract Android project
        run: |
         unzip -o RadioBalkan24_ANDROID_SVE_PROMJENE_UGRADENE-1.zip -d project
          find project -maxdepth 4 -type f

      - name: Check Gradle project
        run: |
          test -f project/RadioBalkan24-Android/settings.gradle || test -f project/RadioBalkan24-Android/settings.gradle.kts

      - name: Build APK
        working-directory: project/RadioBalkan24-Android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioBalkan24-APK
          path: project/RadioBalkan24-Android/**/build/outputs/apk/debug/*.apk
