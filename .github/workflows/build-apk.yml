name: Build RadioBalkan24 APK

'on':
push:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Download repository
    uses: actions/checkout@v4

  - name: Install unzip
    run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Find and extract Android ZIP
    shell: bash
    run: |
      ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

      if [ -z "$ZIP_FILE" ]; then
        echo "Android ZIP nije pronaden!"
        exit 1
      fi

      echo "Pronaden ZIP: $ZIP_FILE"

      mkdir -p project
      unzip -q "$ZIP_FILE" -d project

      SETTINGS_FILE=$(find project -maxdepth 5 -type f -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)

      if [ -z "$SETTINGS_FILE" ]; then
        echo "Gradle projekt nije pronaden!"
        exit 1
      fi

      PROJECT_DIR=$(dirname "$SETTINGS_FILE")

      if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "Android app modul nije pronaden!"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Set up Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    shell: bash
    run: |
      cd "$PROJECT_DIR"

      if [ -f gradlew ]; then
        chmod +x gradlew
        ./gradlew --no-daemon assembleDebug
      else
        gradle --no-daemon assembleDebug
      fi

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: RadioBalkan24-APK
      path: project/**/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
