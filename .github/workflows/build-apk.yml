name: Build RadioBalkan24 APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

  - name: Extract Android project
  run: |
    mkdir -p project
    ZIP_FILE=$(find . -maxdepth 2 -type f -name 'RadioBalkan24_ANDROID*.zip' | head -n 1)
    if [ -z "$ZIP_FILE" ]; then
      echo "Android ZIP nije pronađen!"
      find . -maxdepth 3 -type f
      exit 1
    fi
    echo "Pronađen ZIP: $ZIP_FILE"
    unzip -o "$ZIP_FILE" -d project
          find project -maxdepth 4 -type f

      - name: Check Gradle project
        run: |
          test -f project/RadioBalkan24-Android/settings.gradle || test -f project/RadioBalkan24-Android/settings.gradle.kts

      - name: Build APK
        working-directory: project/RadioBalkan24-Android
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RadioBalkan24-APK
          path: project/RadioBalkan24-Android/**/build/outputs/apk/debug/*.apk
